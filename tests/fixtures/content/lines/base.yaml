# Placeholders. The author replaces these. They read like the systems log; the most specific line whose criteria hold wins.
- id: LINE_STAGE
  when: { beat: stage }
  text: "The team reaches #encounter#."
- id: LINE_SKIP
  when: { beat: skip }
  text: "#encounter# is skipped on momentum."
- id: LINE_CHAIN
  when: { beat: chain }
  text: "The disaster leads to #encounter#."
- id: LINE_CHECK
  when: { beat: check }
  text: "#actor# #actor:checks|check# #skill# at #encounter#."
- id: LINE_CHECK_HELPED
  when: { beat: check, helped: true }
  text: "#actor# #actor:checks|check# #skill# at #encounter#, helped by #helper#."
- id: LINE_CHECK_SUPERVISED
  when: { beat: check, supervised: true }
  text: "#actor# #actor:checks|check# #skill# at #encounter#, supervised by #helper#."
- id: LINE_EFFECTS
  when: { beat: effects }
  text: "The decision takes effect."
- id: LINE_INJURY
  when: { beat: injury }
  text: "#crew# #crew:takes|take# an injury roll at #encounter#."
- id: LINE_INJURY_UNHARMED
  when: { beat: injury, outcome: unharmed }
  text: "#crew# #crew:comes|come# through unharmed."
- id: LINE_INJURY_LIGHT
  when: { beat: injury, outcome: lightInjury }
  text: "#crew# #crew:is|are# lightly injured."
- id: LINE_INJURY_INCAPACITATED
  when: { beat: injury, outcome: incapacitated }
  text: "#crew# #crew:is|are# incapacitated."
- id: LINE_INJURY_DEAD
  when: { beat: injury, outcome: dead }
  text: "#crew# #crew:is|are# killed."
- id: LINE_LEAD
  when: { beat: lead }
  text: "#crew# #crew:takes|take# the lead."
- id: LINE_CALL
  when: { beat: call }
  text: "#lead# #lead:calls|call# in: #decision#."
- id: LINE_NOTICE
  when: { beat: notice }
  text: "#lead# #lead:decides|decide# #decision# without calling."
- id: LINE_ANSWER_BOLD
  when: { beat: answer, answer: bold }
  text: "The captain orders the team on."
- id: LINE_ANSWER_SAFE
  when: { beat: answer, answer: safe }
  text: "The captain orders caution."
- id: LINE_ANSWER_WITHDRAW
  when: { beat: answer, answer: withdraw }
  text: "The captain orders the team out."
- id: LINE_COLLAPSE
  when: { beat: collapse }
  text: "The team collapses."
- id: LINE_RESULT
  when: { beat: result }
  text: "The mission ends."
- id: LINE_REPORT_STAGE
  use: report
  when: { beat: stage }
  text: "The team reached #encounter#."
- id: LINE_REPORT_CHECK
  use: report
  when: { beat: check }
  text: "At #encounter#, #actor# worked #skill#."
- id: LINE_REPORT_CHECK_CRITICAL
  use: report
  when: { beat: check, tier: critical }
  text: "At #encounter#, #actor# excelled at #skill#."
- id: LINE_REPORT_CHECK_BAD
  use: report
  when: { beat: check, tier: [failure, disaster] }
  text: "At #encounter#, #actor# failed at #skill#."
- id: LINE_REPORT_INJURY
  use: report
  when: { beat: injury }
  text: "#crew# was hurt at #encounter#."
- id: LINE_REPORT_INJURY_DEAD
  use: report
  when: { beat: injury, outcome: dead }
  text: "#crew# was killed at #encounter#."
- id: LINE_REPORT_CALL
  use: report
  when: { beat: call }
  text: "#lead# called in: #decision#."
- id: LINE_REPORT_NOTICE
  use: report
  when: { beat: notice }
  text: "#lead# decided #decision# without calling."
- id: LINE_REPORT_ANSWER
  use: report
  when: { beat: answer }
  text: "The captain answered."
- id: LINE_REPORT_COLLAPSE
  use: report
  when: { beat: collapse }
  text: "The team collapsed."
- id: LINE_REPORT_RESULT
  use: report
  when: { beat: result }
  text: "The mission ended."
