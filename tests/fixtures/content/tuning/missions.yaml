# Every number the mission resolver uses. All are required. See docs/gdd.md section 4.
check:
  dice: { count: 2, sides: 6 }   # every check rolls the sum of count dice of this many sides
  target: 7                  # added to an approach's difficulty
  tiers:                     # the lowest margin for each tier; below failure is a disaster
    critical: 5
    success: 0
    partial: -3
    failure: -7
  gearBonus: 2
  assistDivisor: 2           # assist = the helper's skill divided by this, rounded down
compounding:
  cap: 5
  momentum:
    critical: 1
  strain:
    partial: 1
    failure: 2
    disaster: 3
    reliefOnSuccess: 1
  skipAtMomentum: 4
  skipCost: 2
  abortCallAt: 4
  collapseAt: 5
develop:
  reachMargin: 2             # a junior acts only at this expected margin or better
  supervisorPenalty: 1       # the senior carries the junior's check at the best-qualified score minus this
  supervisorGapDivisor: 4    #   and minus one more for every this many levels between senior and junior
calls:
  base: 3
  cautionWeight: 0.5
  disciplineWeight: 0.25
  autonomyWeight: 1
  boldCautionWeight: 2       # the lead prefers bold when priority * boldPriorityWeight
  boldPriorityWeight: 1      #   exceeds caution * boldCautionWeight
  withdrawOfferedAtStakes: 3
  abortStakes: 4
  backedLoyalty: 1
  overruledLoyalty: -1
experience:
  close: 3                   # margin within closeMargin of zero
  near: 2                    # margin within nearMargin of zero
  far: 1
  closeMargin: 3
  nearMargin: 6
  trivialAtMargin: 7         # at this margin or above, nothing is learned
  assistShare: 0.5
  mentorGap: 4
  mentorBonus: 1
injury:
  dice: { count: 2, sides: 6 }   # every injury roll uses these dice
  lightBelow: 7              # light roll: the dice below this is a light injury
  deadBelow: 5               # severe roll: the dice below this is death
  incapacitatedBelow: 8      # severe roll: the dice below this is incapacitation
  medicalBonus: 2
  maxLight: 2                # each light injury is -1 to every skill
result:
  partialAtProgress: 2
bench:
  teams:
    rookie:  { size: 3, skill: [1, 3], seniors: 0, seniorSkill: [1, 3] }
    mixed:   { size: 3, skill: [2, 4], seniors: 1, seniorSkill: [5, 6] }
    veteran: { size: 3, skill: [4, 7], seniors: 0, seniorSkill: [4, 7] }
