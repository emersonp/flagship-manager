# Placeholders. The author replaces these. STORYLET_01 is for the ship (no cast), STORYLET_02 casts one crew member, and STORYLET_03
# two: a holder of trait_g and its target (1e part four).
- id: STORYLET_01
  stakes: 2
  requires: "ship.trait.trait_a == 1"
  text: |-
    captain: STORYLET_01_LINE_1
    best SKILL_A: STORYLET_01_LINE_2
    = #storylet# STORYLET_01_REPORT
  options:
    - { id: option_a, label: STORYLET_01_OPTION_A_LABEL, effects: [{ trait: trait_a, set: 0 }, { loyalty: -1, on: crew }], text: STORYLET_01_OPTION_A_TEXT }
    - { id: option_b, label: STORYLET_01_OPTION_B_LABEL, effects: [{ trait: trait_a, set: 2 }, { trait: trait_f, add: 1 }], text: STORYLET_01_OPTION_B_TEXT }
- id: STORYLET_02
  stakes: 1
  cast:
    subject: "subject.trait.trait_b >= 1 && subject.trait.trait_c == 0"
  text: |-
    subject: STORYLET_02_LINE_1
    captain: STORYLET_02_LINE_2
    = #subject# STORYLET_02_REPORT
  options:
    - { id: option_a, label: STORYLET_02_OPTION_A_LABEL, effects: [{ trait: trait_b, add: -1 }, { trait: trait_c, set: 1 }, { trait: trait_e, set: level_a }], text: STORYLET_02_OPTION_A_TEXT }
    - { id: option_b, label: STORYLET_02_OPTION_B_LABEL, effects: [{ trait: trait_c, set: 2 }, { loyalty: -2, on: subject }], text: "#subject# STORYLET_02_OPTION_B_TEXT" }
- id: STORYLET_03
  stakes: 2
  cast:
    subject: "subject.aboard"
    target: "subject.trait.trait_g.toward(target) >= 3 && subject.trait.trait_g.toward(target) <= 4"
  text: |-
    subject: STORYLET_03_LINE_1
    target: STORYLET_03_LINE_2
    = #subject# STORYLET_03_REPORT #target#
  options:
    - { id: option_a, label: STORYLET_03_OPTION_A_LABEL, effects: [{ trait: trait_g, set: 0, toward: target }, { loyalty: -1, on: subject }], text: STORYLET_03_OPTION_A_TEXT }
    - { id: option_b, label: STORYLET_03_OPTION_B_LABEL, effects: [{ trait: trait_g, set: 5, toward: target }], text: STORYLET_03_OPTION_B_TEXT }
