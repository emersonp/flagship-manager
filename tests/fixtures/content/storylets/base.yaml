# Placeholders. The author replaces these. STORYLET_01 is for the ship (no cast), STORYLET_02 casts one crew member, and STORYLET_03
# two: a holder of trait_g and its target (1e part four). STORYLET_04 casts a holder of trait_h and its target, and its first
# option is settled by a check with a handler the captain names; its second has requires (1e part four, Task 6). STORYLET_05 can't
# cast: its first slot holds for whoever was hurt last cycle, but no one's loyalty passes 100, so its second never holds (Task 8).
# STORYLET_06 is the short version of "The names on the wall" (1e part five, design 4.8): two deaths within 120 days, and a voice
# who lost a crewmate; its first option writes a weight-4 entry in its own words, and its last sets trait_k.
- id: STORYLET_01
  stakes: 2
  requires: "ship.trait.trait_a == 1"
  text: |-
    captain: STORYLET_01_LINE_1
    best SKILL_A: STORYLET_01_LINE_2
    = #storylet# STORYLET_01_REPORT
  options:
    - { id: option_a, label: STORYLET_01_OPTION_A_LABEL, effects: [{ trait: trait_a, set: 0 }, { loyalty: -1, on: crew }], text: STORYLET_01_OPTION_A_TEXT }
    - { id: option_b, label: STORYLET_01_OPTION_B_LABEL, effects: [{ trait: trait_a, set: 2 }, { trait: trait_f, add: 1 }], text: STORYLET_01_OPTION_B_TEXT }
- id: STORYLET_02
  stakes: 1
  cast:
    subject: "subject.trait.trait_b >= 1 && subject.trait.trait_c == 0"
  text: |-
    subject: STORYLET_02_LINE_1
    captain: STORYLET_02_LINE_2
    = #subject# STORYLET_02_REPORT
  options:
    - { id: option_a, label: STORYLET_02_OPTION_A_LABEL, effects: [{ trait: trait_b, add: -1 }, { trait: trait_c, set: 1 }, { trait: trait_e, set: level_a }], text: STORYLET_02_OPTION_A_TEXT }
    - { id: option_b, label: STORYLET_02_OPTION_B_LABEL, effects: [{ trait: trait_c, set: 2 }, { loyalty: -2, on: subject }], text: "#subject# STORYLET_02_OPTION_B_TEXT" }
- id: STORYLET_03
  stakes: 2
  cast:
    subject: "subject.aboard"
    target: "subject.trait.trait_g.toward(target) >= 3 && subject.trait.trait_g.toward(target) <= 4"
  text: |-
    subject: STORYLET_03_LINE_1
    target: STORYLET_03_LINE_2
    = #subject# STORYLET_03_REPORT #target#
  options:
    - { id: option_a, label: STORYLET_03_OPTION_A_LABEL, effects: [{ trait: trait_g, set: 0, toward: target }, { loyalty: -1, on: subject }], text: STORYLET_03_OPTION_A_TEXT }
    - { id: option_b, label: STORYLET_03_OPTION_B_LABEL, effects: [{ trait: trait_g, set: 5, toward: target }], text: STORYLET_03_OPTION_B_TEXT }
- id: STORYLET_04
  stakes: 3
  cast:
    subject: "subject.aboard"
    target: "subject.trait.trait_h.toward(target) >= 1"
  text: |-
    subject: STORYLET_04_LINE_1
    = #subject# STORYLET_04_REPORT #target#
  options:
    - { id: option_a, label: STORYLET_04_OPTION_A_LABEL, check: { skill: SKILL_B, difficulty: 4 },
        success: { effects: [{ trait: trait_h, set: 0, toward: target }, { morale: 2, on: handler }], text: "#handler# STORYLET_04_SUCCESS" },
        failure: { effects: [{ trait: trait_h, set: 0, toward: target }, { morale: -2, on: subject }], text: "#handler# STORYLET_04_FAILURE" } }
    - { id: option_b, label: STORYLET_04_OPTION_B_LABEL, requires: "subject.loyalty >= 60", effects: [{ trait: trait_h, set: 0, toward: target }, { loyalty: -1, on: subject }], text: STORYLET_04_OPTION_B_TEXT }
    - { id: option_c, label: STORYLET_04_OPTION_C_LABEL, effects: [{ trait: trait_h, set: 0, toward: target }], text: STORYLET_04_OPTION_C_TEXT }
- id: STORYLET_05
  stakes: 1
  cast:
    subject: "subject.history.last('hurt')"
    target: "target.loyalty > 100"
  cooldown: { cast: 6 }
  text: |-
    subject: STORYLET_05_LINE_1
    = #subject# STORYLET_05_REPORT #target#
  options:
    - { id: option_a, label: STORYLET_05_OPTION_A_LABEL, effects: [{ morale: 1, on: target }], text: STORYLET_05_OPTION_A_TEXT }
    - { id: option_b, label: STORYLET_05_OPTION_B_LABEL, effects: [{ loyalty: -1, on: subject }], text: STORYLET_05_OPTION_B_TEXT }
- id: STORYLET_06
  stakes: 3
  requires: "chronicle.count('death', 120) >= 2"
  cast:
    voice: "voice.aboard && voice.history.count('lost_crewmate', 20) >= 1"
  cooldown: { cast: 20, global: 20 }
  text: |-
    voice: STORYLET_06_LINE_1
    = #voice# STORYLET_06_REPORT
  options:
    - { id: option_a, label: STORYLET_06_OPTION_A_LABEL, effects: [{ morale: 2, on: crew }], chronicle: { weight: 4, text: "#voice# STORYLET_06_CHRONICLE" }, text: "#voice# STORYLET_06_OPTION_A_TEXT" }
    - { id: option_b, label: STORYLET_06_OPTION_B_LABEL, effects: [{ morale: 2, on: voice }], text: "#voice# STORYLET_06_OPTION_B_TEXT" }
    - { id: option_c, label: STORYLET_06_OPTION_C_LABEL, effects: [{ trait: trait_k, set: 1, on: voice }], text: "#voice# STORYLET_06_OPTION_C_TEXT" }
