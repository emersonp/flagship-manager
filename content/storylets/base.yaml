# Generated fiction, by the author's one-time allowance for slice 1e's storylets (GDD section 15, item 37; 2026-11-16).
# The ids and every number are the placeholders' own; only names and words are new.
# Traits (docs/conventions.md; their rules are in traits/base.yaml): sensors_quirk on the ship (noticed, let_ride), set by the Debris
# Shoal; shaken on a crew member, added to by the Collapsed Gallery; shaken_heard on them (heard, turned_away); stood_down, the
# promise of a rest (promised, broken); avoids, a pair, set by the Salvagers' Picket and by "The one who came back"; came_back
# on a crew member (settled, withdrawn), set by "The one who came back" and "Still not talking".
- id: STORYLET_01
  name: A quirk in the sensors
  stakes: 2
  requires: "ship.trait.sensors_quirk == 'noticed'"
  text: |-
    > Forward array variance: 0.4 seconds, rising.
    best SKILL_A: Captain, the forward array is reading ghosts. Contacts that aren't there, and a lag on the ones that are.
    best SKILL_B: Something in the shoal knocked it off true. A full recalibration takes the off-duty watch, all night.
    captain: And if we leave it?
    best SKILL_A: Then we fly half a second blind, and we remember that we do.
    = The forward array has read false since the Debris Shoal.
  options:
    - id: recalibrate
      label: Recalibrate tonight
      effects: [{ trait: sensors_quirk, set: 0 }, { loyalty: -1, on: crew }]
      text: The off-duty watch spent their rest in the sensor bay, and the forward array reads true again.
    - id: fly_on
      label: Fly on it
      effects: [{ trait: sensors_quirk, set: 2 }]
      text: The forward array stays as it is. Every reading from it now carries a margin, and the bridge knows it.
- id: STORYLET_02
  name: Someone shaken
  stakes: 3
  cast:
    subject: "subject.trait.shaken >= 1 && subject.trait.shaken_heard == 0"
  text: |-
    > Request from #subject#: a word with the captain, in private.
    subject: Captain. Have you got a minute? It's about the gallery.
    subject: I keep feeling the deck go out from under me. I'm on shift in an hour.
    = #subject# asked the captain for a word after the Collapsed Gallery.
  options:
    - id: make_time
      label: Make the time
      # Everyone's loyalty dips but the subject's: the captain is seen to have favourites.
      effects: [{ trait: shaken, add: -1 }, { trait: shaken_heard, set: heard }, { loyalty: -1, on: crew }, { loyalty: 1, on: subject }]
      text: "#subject# had the captain's door for the better part of an hour, and the rest of the crew noticed whose it was."
    - id: stand_down
      label: Stand them down
      # A promise for the next away team: kept by leaving them aboard, broken by sending them (stood_down's launch rules).
      effects: [{ trait: shaken_heard, set: heard }, { trait: stood_down, set: promised }]
      text: "#subject# was told they would sit out the next away team, and went back on shift a little lighter."
    - id: carry_on
      label: Tell them to carry on
      effects: [{ trait: shaken_heard, set: turned_away }, { loyalty: -2, on: subject }]
      text: "#subject# was told to carry on, and went back on shift without another word."
- id: STORYLET_03
  name: You gave your word
  stakes: 2
  cast:
    subject: "subject.trait.stood_down == 'broken'"
  text: |-
    > Request from #subject#: a word with the captain.
    subject: You said I'd sit the next one out. Then you put me on the shuttle.
    subject: I'm not asking for much, Captain. I'm asking whether your word counts.
    = #subject# came to the captain about the promise that was broken.
  options:
    - id: apologise
      label: Apologise
      effects: [{ loyalty: 1, on: subject }, { trait: stood_down, set: 0 }]
      text: "The captain owned the broken promise, and #subject# seemed to take that as worth something."
    - id: stand_by
      label: Stand by the order
      # The whole crew hears that a promise from the bridge can be taken back.
      effects: [{ morale: -2, on: crew }, { trait: stood_down, set: 0 }]
      text: "The captain stood by the order, and by evening the whole ship had heard what a promise from the bridge was worth."
- id: STORYLET_04
  name: Clear the air
  stakes: 2
  cast:
    subject: "subject.aboard"
    target: "subject.trait.avoids.toward(target) >= 3 && subject.trait.avoids.toward(target) <= 4"
  text: |-
    > Duty roster note: #subject# has asked again not to be posted with #target#.
    subject: I'll work any shift, Captain. Just not that one.
    target: If they've got something to say to me, they can say it.
    = #subject# and #target# have been keeping out of each other's way since the Salvagers' Picket.
  options:
    - id: work_it_out
      label: Order them to work it out
      effects: [{ trait: avoids, set: 0, toward: target }, { loyalty: -1, on: subject }]
      text: "#subject# and #target# were put in a room until they had it out, and came out speaking, if not friends."
    - id: keep_apart
      label: Keep them apart
      # Out of this storylet's range; the weekly step brings it back to 4 in four weeks, and they are in each other's way again.
      effects: [{ trait: avoids, set: 5, toward: target }]
      text: "#subject# and #target# were posted on different watches, and the roster quietly grew a rule."
# The one who came back (1e part four, design 4.13): a survivor of a lost mission, and someone who was not on it. Every answer sets
# came_back, which is how both this and "Still not talking" come to be read. The window is two cycles, not three: "Still not talking"
# can clear came_back two cycles after the loss at the earliest, and three would cast this again over the same loss.
# Failure and leave_it add avoids 2, so "Still not talking" comes, and with its cast cooldown of 4 comes back once at 1; avoids
# falls to 0 before a third time.
- id: STORYLET_05
  name: The one who came back
  stakes: 3
  cast:
    subject: "subject.history.count('lost_mission', 2) > 0 && subject.trait.came_back == 0"
    target: "target.aboard && target.history.count('lost_mission', 2) == 0"
  cooldown: { cast: 8, global: 2 }
  text: |-
    > Mess hall, second watch. #target# sat down across the table, and #subject# picked up their tray and left.
    target: Was it something I said?
    subject: You weren't down there. Leave it.
    = #subject# has kept apart since the mission was lost, and walked away from #target# in the mess.
  options:
    - { id: talk, label: Have someone talk to them, check: { skill: SKILL_D, difficulty: 4 },
        success: { effects: [{ trait: came_back, set: settled, on: subject }, { morale: 3, on: subject }], text: "#handler# found #subject# in the observation lounge and stayed until the talking started. By the next watch #subject# was back at the mess table." },
        failure: { effects: [{ trait: came_back, set: withdrawn, on: subject }, { trait: avoids, add: 2, on: subject, toward: target }], text: "#handler# tried. #subject# heard them out, said nothing, and now keeps clear of #target# as well." } }
    - { id: leave_it, label: Leave them be, effects: [{ trait: came_back, set: withdrawn, on: subject }, { trait: avoids, add: 2, on: subject, toward: target }], text: "#subject# was left to it. They eat alone now, and take the long way round when #target# is in the corridor." }
    - { id: back_on_watch, label: Put them back on the watch bill, requires: "subject.loyalty >= 60", effects: [{ trait: came_back, set: settled, on: subject }, { loyalty: -1, on: subject }], text: "#subject# was told the mission was over and the watch was not. They took it as an order, and went back to work." }
# Still not talking (1e part four, design 4.13): the one who came back still keeps clear of someone. The cast cooldown lets it come
# back while came_back and avoids last; only a talk that gets through clears them.
- id: STORYLET_06
  name: Still not talking
  stakes: 2
  cast:
    subject: "subject.trait.came_back == 'withdrawn'"
    target: "subject.trait.avoids.toward(target) >= 1"
  cooldown: { cast: 4 }
  text: |-
    > Duty roster note: #subject# has swapped off every watch they shared with #target#.
    target: I don't know what I did, Captain. They won't say.
    = #subject# still isn't talking to #target#.
  options:
    - { id: try_again, label: Send someone to try again, check: { skill: SKILL_D, difficulty: 5 },
        success: { effects: [{ trait: came_back, set: 0, on: subject }, { trait: avoids, set: 0, on: subject, toward: target }, { morale: 2, on: subject }], text: "#handler# sat #subject# and #target# down in the same room and did not let either leave. It came out at last: #subject# blamed #target# for not being there, and knew it was not fair." },
        failure: { effects: [{ morale: -1, on: handler }], text: "#handler# got as far as the door of #subject#'s quarters, and no further." } }
    - { id: let_it_lie, label: Let it lie, effects: [], text: "Nobody pushed it. The roster kept #subject# and #target# on different watches." }
