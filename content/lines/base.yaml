# Generated fiction (2026-11-15), by the author's one-time exception to the placeholder rule. These are the shared lines: what an
# encounter falls back on when it has no words of its own, and what belongs to no encounter (injuries, the lead, the captain's
# answers). An encounter's or an objective's own words are written in that item, not here. Past tense where the report reads it.
- id: LINE_STAGE
  when: { beat: stage }
  text: "#lead# brought the team to the #encounter#."
- id: LINE_SKIP
  when: { beat: skip }
  text: "The team was moving well, and passed the #encounter# without stopping."
- id: LINE_CHAIN
  when: { beat: chain }
  text: "#went_wrong# What followed was the #encounter#."
- id: LINE_CHECK
  when: { beat: check }
  text: "#actor# worked the problem at the #encounter# #steadily#."
- id: LINE_CHECK_HELPED
  when: { beat: check, helped: true }
  text: "#actor# worked the problem at the #encounter#, with #helper# at #actor.their# shoulder."
- id: LINE_CHECK_SUPERVISED
  when: { beat: check, supervised: true }
  text: "#actor# took the #encounter# under #helper#'s eye."
- id: LINE_CHECK_CRITICAL
  when: { beat: check, tier: critical }
  text: "#actor# made short work of the #encounter#. #went_right#"
- id: LINE_CHECK_BAD
  when: { beat: check, tier: [failure, disaster] }
  text: "#actor#'s #skill# fell short at the #encounter#. #went_wrong#"
- id: LINE_CHECK_CAUTIOUS_BAD
  name: A cautious actor fails
  when: { beat: check, tier: [failure, disaster], actor.caution: { min: 1 } }
  text: "#actor# had checked everything twice at the #encounter#, and it failed anyway."
- id: LINE_CHECK_RECKLESS_BAD
  name: A reckless actor fails
  when: { beat: check, tier: [failure, disaster], actor.caution: { max: -1 } }
  text: "#actor# went at the #encounter# without waiting, and paid for it."
- id: LINE_EFFECTS
  when: { beat: effects }
  text: The choice played out.
- id: LINE_INJURY_UNHARMED
  when: { beat: injury, outcome: unharmed }
  text: "#crew# came through it unharmed."
- id: LINE_INJURY_LIGHT
  when: { beat: injury, outcome: lightInjury }
  text: "#crew# was hurt at the #encounter#, but stayed on #crew.their# feet."
- id: LINE_INJURY_INCAPACITATED
  when: { beat: injury, outcome: incapacitated }
  text: |-
    lead: #crew# is down. Breathing, but down.
    = #crew# was badly hurt at the #encounter# and could not go on.
- id: LINE_INJURY_DEAD
  when: { beat: injury, outcome: dead }
  text: |-
    > One life sign lost.
    lead: Captain... #crew# is gone.
    = #crew# was killed at the #encounter#.
- id: LINE_INJURY_LAST
  name: The last of the team dies
  when: { beat: injury, outcome: dead, teamStanding: 0 }
  text: |-
    > No life signs detected.
    = #crew# was the last of the team, and died at the #encounter#.
- id: LINE_LEAD
  when: { beat: lead }
  text: |-
    crew: This is #crew#. I have the team.
    = #crew# took command of the team.
- id: LINE_CALL
  when: { beat: call }
  text: |-
    lead: Captain, I need a decision. #decision#.
    captain: #captain_ask#
    = #lead# called in for a decision: #decision#.
- id: LINE_CALL_ABORT
  name: The lead asks whether to pull out
  when: { beat: call, decision: DECISION_ABORT }
  text: |-
    lead: Captain, we're coming apart down here. I can keep them going, but I won't pretend it's safe.
    captain: #captain_ask#
    lead: We push on, or you bring us home.
    = #lead# called in to ask whether the team should be pulled out.
- id: LINE_INITIATIVE
  when: { beat: initiative }
  text: "#lead# made the call alone: #decision#."
- id: LINE_ANSWER_BOLD
  when: { beat: answer, answer: bold }
  text: |-
    captain: #captain_bold#
    = The captain ordered the team on.
- id: LINE_ANSWER_SAFE
  when: { beat: answer, answer: safe }
  text: |-
    captain: #captain_safe#
    = The captain ordered caution.
- id: LINE_ANSWER_WITHDRAW
  when: { beat: answer, answer: withdraw }
  text: |-
    captain: #captain_home#
    = The captain ordered the team out.
- id: LINE_ANSWER_OVERRULED
  name: The captain overrules the lead
  when: { beat: answer, standing: overruled }
  text: |-
    captain: I hear you, #lead#. My answer is no.
    lead: Understood, Captain.
    = The captain overruled #lead#.
- id: LINE_COLLAPSE
  when: { beat: collapse }
  text: |-
    > Team cohesion lost.
    = The team came apart, and the mission with it.
- id: LINE_RESULT
  when: { beat: result }
  text: The mission ended.
# How the cycle's turn went (slice 1e-calendar), said at the top of the itinerary. Generated 2026-11-20, for the author to rewrite.
# #days# is the days early or late ("4 days"), #planned# the weeks planned ("5 weeks"); the cycle's length is never said.
- id: LINE_SCHEDULE_AHEAD
  name: The ship arrives ahead of schedule
  when: { beat: schedule, schedule: ahead }
  text: The crossing ran clean, and the ship made orbit ahead of schedule.
- id: LINE_SCHEDULE_ON
  name: The ship arrives on schedule
  when: { beat: schedule, schedule: "on" }
  text: The ship made orbit on schedule.
- id: LINE_SCHEDULE_DELAYED
  name: The ship arrives delayed
  when: { beat: schedule, schedule: delayed }
  text: The crossing dragged, and the ship made orbit behind schedule.
- id: LINE_SCHEDULE_TRAVEL_AHEAD
  name: A journey arrives early
  when: { beat: schedule, schedule: ahead, travel: true }
  text: "Planned at #planned#, the journey came in #days# early."
- id: LINE_SCHEDULE_TRAVEL_ON
  name: A journey arrives on time
  when: { beat: schedule, schedule: "on", travel: true }
  text: "Planned at #planned#, the journey came in on schedule, to the day."
- id: LINE_SCHEDULE_TRAVEL_DELAYED
  name: A journey arrives late
  when: { beat: schedule, schedule: delayed, travel: true }
  text: "Planned at #planned#, the journey ran #days# late."
# The chronicle (slice 1e part five, design 4.3): each entry's words, written once when it happens and never again. Plain prose,
# no speakers. The founding names no ship or captain: neither exists yet. #crew# is the starting crew's size.
- id: LINE_CHRONICLE_FOUNDING
  name: The legacy is founded
  when: { beat: chronicle_founding }
  text: "The ship took on her first crew of #crew#."
# A death. #dead# is the one lost, #lead# the lead the mission started with, #cycles# the cycles served ("8 cycles").
- id: LINE_CHRONICLE_DEATH
  name: A crew member is lost
  when: { beat: chronicle_death }
  text: "#dead# fell at the #encounter#, on #lead#'s away team, after #cycles# aboard."
- id: LINE_CHRONICLE_DEATH_LEAD
  name: The lead is lost
  when: { beat: chronicle_death, dead.isLead: true }
  text: "#dead# fell at the #encounter#, leading the away team, after #cycles# aboard."
# A mission's end, after its deaths. #team# is how many were sent, #deaths# how many of them died.
- id: LINE_CHRONICLE_MISSION_FULL
  name: A mission succeeds in full
  when: { beat: chronicle_mission, outcome: fullSuccess }
  text: "#lead# led #team# on the #objective#, and saw it done."
- id: LINE_CHRONICLE_MISSION_PARTIAL
  name: A mission succeeds in part
  when: { beat: chronicle_mission, outcome: partialSuccess }
  text: "#lead# led #team# on the #objective#; it was done only in part."
- id: LINE_CHRONICLE_MISSION_WITHDRAWAL
  name: A mission is abandoned
  when: { beat: chronicle_mission, outcome: withdrawal }
  text: "#lead# led #team# on the #objective#; it was abandoned."
- id: LINE_CHRONICLE_MISSION_LOSS
  name: A mission is lost
  when: { beat: chronicle_mission, outcome: loss }
  text: "#lead# led #team# on the #objective#; it was lost."
- id: LINE_CHRONICLE_MISSION_INCOMPLETE
  name: A mission is left unfinished
  when: { beat: chronicle_mission, outcome: incomplete }
  text: "#lead# led #team# on the #objective#; it was left unfinished."
- id: LINE_CHRONICLE_MISSION_WON_ONE_DEAD
  name: A mission succeeds, and one dies
  when: { beat: chronicle_mission, outcome: [fullSuccess, partialSuccess], deaths: 1 }
  text: "#lead# led #team# on the #objective#, and saw it done. One did not return."
- id: LINE_CHRONICLE_MISSION_WON_DEAD
  name: A mission succeeds, and several die
  when: { beat: chronicle_mission, outcome: [fullSuccess, partialSuccess], deaths: { min: 2 } }
  text: "#lead# led #team# on the #objective#, and saw it done. #deaths# did not return."
- id: LINE_CHRONICLE_MISSION_LOST_ONE_DEAD
  name: A mission fails, and one dies
  when: { beat: chronicle_mission, outcome: [withdrawal, loss, incomplete], deaths: 1 }
  text: "#lead# led #team# on the #objective#, and it failed. One did not return."
- id: LINE_CHRONICLE_MISSION_LOST_DEAD
  name: A mission fails, and several die
  when: { beat: chronicle_mission, outcome: [withdrawal, loss, incomplete], deaths: { min: 2 } }
  text: "#lead# led #team# on the #objective#, and it failed. #deaths# did not return."
# A call answered. #lead# is the lead who made it.
- id: LINE_CHRONICLE_CALL_BACKED
  name: The captain backs the lead
  when: { beat: chronicle_call, standing: backed }
  text: "At the #encounter#, the captain backed #lead#'s call."
- id: LINE_CHRONICLE_CALL_NEUTRAL
  name: The captain calls the team back
  when: { beat: chronicle_call, standing: neutral }
  text: "At the #encounter#, #lead# asked for caution, and the captain called the team back."
- id: LINE_CHRONICLE_CALL_OVERRULED
  name: The captain overrules the lead
  when: { beat: chronicle_call, standing: overruled }
  text: "At the #encounter#, the captain overruled #lead#."
- id: LINE_CHRONICLE_CALL_OVERRULED_BOLD
  name: The captain overrules the lead and presses on
  when: { beat: chronicle_call, standing: overruled, answer: bold }
  text: "At the #encounter#, the captain overruled #lead# and pressed on."
- id: LINE_CHRONICLE_CALL_OVERRULED_SAFE
  name: The captain overrules the lead and holds back
  when: { beat: chronicle_call, standing: overruled, answer: safe }
  text: "At the #encounter#, the captain overruled #lead# and held back."
- id: LINE_CHRONICLE_CALL_OVERRULED_WITHDRAW
  name: The captain overrules the lead and withdraws
  when: { beat: chronicle_call, standing: overruled, answer: withdraw }
  text: "At the #encounter#, the captain overruled #lead# and called the team back."
