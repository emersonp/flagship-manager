- id: ENCOUNTER_CHAIN
  name: Sudden Breach
  tags: [chained, hazard]
  text:
    arrive: |-
      > Structural failure. Atmosphere venting.
      lead: Everyone move! Move!
      = The structure gave way around the team.
  approaches:
    - id: careful
      name: Careful
      skill: SKILL_C
      difficulty: 6
      text:
        attempt: "actor: Seal your suits and follow the wall. Do not run."
        success: "#actor# got the team clear of the breach in good order."
        failure: "#actor# got the team clear of the breach, but not together and not unhurt."
    - id: fast
      name: Fast
      skill: SKILL_A
      difficulty: 7
      outcomes:
        critical: [{ progress: 1 }, { strain: -1 }, { momentum: 2 }]
        success: [{ progress: 1 }, { strain: -1 }, { momentum: 1 }]
      text:
        attempt: "actor: The venting has a pattern. Go when I say go."
        success: "#actor# timed the venting, and the team crossed the breach between breaths."
        disaster: |-
          actor: Go! No, wait...
          > Decompression.
          = #actor# mistimed the venting at the breach.
  lines:
    - when: { beat: injury, outcome: dead }
      text: |-
        > One suit telemetry feed ended.
        = #crew# did not make it out of the breach.
